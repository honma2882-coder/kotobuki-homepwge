<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ひびのメモ帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: notebook page — month calendar on the left, the selected day as a ruled-paper timeline on the right; stacks on phones */
:root{
  --paper:#fbfaf6; --sheet:#ffffff; --ink:#23262b; --muted:#6c7079; --rule:#e4e6ec; --line:#c9ccd4;
  --accent:#2f5bd3; --accent-soft:#e7edfc; --today:#2f5bd3;
  --c0:#e0574f; --c1:#ef9b2d; --c2:#3aa36b; --c3:#2f8fd3; --c4:#8a5bd6; --c5:#d4549b; --c6:#7a8088;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16181c; --sheet:#1e2126; --ink:#e9eaee; --muted:#9a9fa9; --rule:#2c3037; --line:#454a53;
  --accent:#7d9cff; --accent-soft:#25304d; --today:#7d9cff;
  --c0:#ef7a72; --c1:#f2b05a; --c2:#5cc08a; --c3:#5aaef0; --c4:#a888ea; --c5:#e57ab4; --c6:#9aa0a8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181c; --sheet:#1e2126; --ink:#e9eaee; --muted:#9a9fa9; --rule:#2c3037; --line:#454a53;
  --accent:#7d9cff; --accent-soft:#25304d; --today:#7d9cff;
  --c0:#ef7a72; --c1:#f2b05a; --c2:#5cc08a; --c3:#5aaef0; --c4:#a888ea; --c5:#e57ab4; --c6:#9aa0a8;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:20px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
h1,h2{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
.brand{max-width:1100px;margin:0 auto 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.5rem}
.brand p{margin:0;color:var(--muted);font-size:.85rem}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head h2{font-size:1.3rem;flex:1}
.cal-head h2 small{font-family:var(--f-mono);color:var(--muted);font-size:.8rem;margin-left:6px}
.iconbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;min-width:36px;height:36px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:.72rem;text-align:center;color:var(--muted);letter-spacing:.08em;padding-bottom:2px}
.dow.sun{color:var(--c0)} .dow.sat{color:var(--c3)}
.day{min-height:84px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:hover{background:var(--accent-soft)}
.day.out{opacity:.38}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.day .n{font-family:var(--f-mono);font-size:.82rem;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.sun .n{color:var(--c0)} .day.sat .n{color:var(--c3)}
.day.today .n{background:var(--today);color:var(--sheet)}
.chip{font-size:.66rem;line-height:1.35;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);background:color-mix(in srgb,var(--cc) 20%,transparent);border-left:3px solid var(--cc)}
.chip.done{text-decoration:line-through;opacity:.6}
.more{font-size:.64rem;color:var(--muted)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--cc)}
@media (max-width:560px){.day{min-height:56px;align-items:center}.chip,.more{display:none}.dots{display:flex;justify-content:center}}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--cc)}

/* day page */
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.dayhead h2{font-size:1.6rem}
.dayhead .wd{font-family:var(--f-display);color:var(--muted)}
.progress{font-size:.8rem;color:var(--muted);margin-bottom:14px}
.bar{height:6px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:4px}
.bar b{display:block;height:100%;background:var(--accent);transition:width .3s}

.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0 39px,var(--rule) 39px 40px);border-radius:8px}
.sec-label{font-size:.72rem;letter-spacing:.12em;color:var(--muted);margin:10px 0 4px}
.timeline{position:relative;padding-left:72px}
.timeline::before{content:"";position:absolute;left:62px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.empty{color:var(--muted);font-size:.85rem;padding:8px 0}
.item{position:relative;display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 6px;border-radius:8px}
.item:hover{background:color-mix(in srgb,var(--cc) 10%,transparent)}
.item .t{position:absolute;left:-72px;width:56px;text-align:right;font-family:var(--f-mono);font-size:.82rem;color:var(--muted);top:50%;transform:translateY(-50%);line-height:1.2}
.item .t small{display:block;font-size:.68rem}
.timeline .item::before{content:"";position:absolute;left:-14px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--cc);border:2px solid var(--sheet)}
.check{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--cc);background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:14px;height:14px;stroke:var(--sheet);stroke-width:3;fill:none;opacity:0}
.item.done .check{background:var(--cc)} .item.done .check svg{opacity:1}
.item .title{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0;font-size:1rem;overflow-wrap:anywhere;font-family:var(--f-display);font-weight:500}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.tag{flex:none;font-size:.68rem;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--ink)}
.todo{padding-left:6px}

/* form */
form.add{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
input[type=text]{flex:1 1 200px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--paper)}
input[type=time]{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:var(--paper);font-family:var(--f-mono);font-size:.9rem}
.lbl{font-size:.78rem;color:var(--muted)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--cc);padding:0;position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--cc)}
.primary{border:0;background:var(--accent);color:var(--sheet);border-radius:10px;padding:9px 18px;font-weight:700}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 14px}
.danger{border:1px solid var(--c0);color:var(--c0);background:transparent;border-radius:10px;padding:8px 14px}
.hint{font-size:.75rem;color:var(--muted)}

/* edit sheet */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 40%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--sheet);border-radius:16px;padding:18px;width:min(440px,100%);display:grid;gap:12px;border:1px solid var(--rule)}
.sheet h3{margin:0;font-family:var(--f-display)}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<header class="brand">
  <h1>ひびのメモ帳</h1>
  <p>今日やることを、時間と色で整理する</p>
</header>

<main class="wrap">
  <section class="card" aria-label="カレンダー">
    <div class="cal-head">
      <button class="iconbtn" id="prev" aria-label="前の月">‹</button>
      <h2 id="monthLabel"></h2>
      <button class="iconbtn" id="todayBtn">今日</button>
      <button class="iconbtn" id="next" aria-label="次の月">›</button>
    </div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="days"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card" aria-label="選んだ日の予定">
    <div class="dayhead"><h2 id="dayLabel"></h2><span class="wd" id="dayWd"></span></div>
    <div class="progress"><span id="progText"></span><div class="bar"><b id="progBar" style="width:0"></b></div></div>

    <div class="sec-label">時間の決まっている予定</div>
    <div class="timeline ruled" id="timeline"></div>

    <div class="sec-label">今日中にやること</div>
    <div class="todo ruled" id="todo"></div>

    <form class="add" id="addForm" autocomplete="off">
      <div class="row">
        <input type="text" id="addTitle" placeholder="予定ややることを入力（例：ゴミ捨て）" aria-label="予定の名前" required>
      </div>
      <div class="row">
        <span class="lbl">時間</span>
        <input type="time" id="addStart" aria-label="開始時刻">
        <span class="lbl">〜</span>
        <input type="time" id="addEnd" aria-label="終了時刻">
        <span class="hint">空欄なら「やること」に入ります</span>
      </div>
      <div class="row">
        <div class="swatches" id="addSw" role="group" aria-label="色"></div>
        <button class="primary" type="submit" style="margin-left:auto">追加</button>
      </div>
    </form>
  </section>
</main>

<div class="scrim" id="editScrim" hidden>
  <form class="sheet" id="editForm" autocomplete="off">
    <h3>予定を編集</h3>
    <input type="text" id="editTitle" aria-label="予定の名前" required>
    <div class="row">
      <span class="lbl">日付</span><input type="date" id="editDate" aria-label="日付" style="border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:var(--paper)">
    </div>
    <div class="row">
      <span class="lbl">時間</span>
      <input type="time" id="editStart" aria-label="開始時刻"><span class="lbl">〜</span><input type="time" id="editEnd" aria-label="終了時刻">
    </div>
    <div class="swatches" id="editSw" role="group" aria-label="色"></div>
    <div class="actions">
      <button type="button" class="danger" id="delBtn">削除</button>
      <span style="display:flex;gap:8px">
        <button type="button" class="ghost" id="cancelBtn">やめる</button>
        <button type="submit" class="primary">保存</button>
      </span>
    </div>
  </form>
</div>

<script>
(function(){
  const COLORS = [
    {name:'仕事', v:'--c0'}, {name:'家事', v:'--c1'}, {name:'SNS', v:'--c2'},
    {name:'用事', v:'--c3'}, {name:'趣味', v:'--c4'}, {name:'美容', v:'--c5'}, {name:'その他', v:'--c6'}
  ];
  const WD = ['日','月','火','水','木','金','土'];
  const KEY = 'hibi-memo-v1';
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
  const cvar = i => 'var('+COLORS[i]?.v+')';
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  const today = new Date();
  let items = load();
  let selected = ymd(today);
  let viewY = today.getFullYear(), viewM = today.getMonth();
  let addColor = 0, editColor = 0, editingId = null;

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    // 初回だけ表示する見本（ノートのメモをもとにした例）
    const t = ymd(new Date());
    return [
      {id:uid(), date:t, title:'収録', start:'14:00', end:'', color:0, done:false},
      {id:uid(), date:t, title:'就寝', start:'23:00', end:'', color:6, done:false},
      {id:uid(), date:t, title:'せんたく', start:'', end:'', color:1, done:true},
      {id:uid(), date:t, title:'かみそめる', start:'', end:'', color:5, done:false},
      {id:uid(), date:t, title:'ゴミ捨て', start:'', end:'', color:1, done:false},
      {id:uid(), date:t, title:'SNSショート 3〜4本', start:'', end:'', color:2, done:false},
      {id:uid(), date:t, title:'カミノバ', start:'', end:'', color:3, done:false}
    ];
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} }

  const byDate = d => items.filter(i => i.date === d);
  const sortTimed = arr => arr.slice().sort((a,b)=> a.start.localeCompare(b.start));

  // ---- swatches
  function buildSwatches(el, get, set){
    el.innerHTML = '';
    COLORS.forEach((c,i)=>{
      const b = document.createElement('button');
      b.type='button'; b.className='sw'; b.style.setProperty('--cc', cvar(i));
      b.title=c.name; b.setAttribute('aria-label', c.name);
      b.setAttribute('aria-pressed', String(get()===i));
      b.onclick = ()=>{ set(i); [...el.children].forEach((x,j)=>x.setAttribute('aria-pressed', String(j===i))); };
      el.appendChild(b);
    });
  }

  // ---- calendar
  function renderCalendar(){
    document.getElementById('monthLabel').innerHTML = (viewM+1)+'月<small>'+viewY+'</small>';
    const dows = document.getElementById('dows');
    dows.innerHTML = WD.map((w,i)=>`<div class="dow ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('');
    const first = new Date(viewY, viewM, 1);
    const start = new Date(viewY, viewM, 1 - first.getDay());
    const days = document.getElementById('days');
    days.innerHTML = '';
    const weeks = Math.ceil((first.getDay() + new Date(viewY, viewM+1, 0).getDate())/7);
    for(let k=0;k<weeks*7;k++){
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+k);
      const key = ymd(d);
      const list = sortTimed(byDate(key).filter(i=>i.start)).concat(byDate(key).filter(i=>!i.start));
      const b = document.createElement('button');
      b.className = 'day' + (d.getMonth()!==viewM?' out':'') + (key===ymd(today)?' today':'') + (key===selected?' sel':'') + (d.getDay()===0?' sun':d.getDay()===6?' sat':'');
      b.setAttribute('aria-label', (d.getMonth()+1)+'月'+d.getDate()+'日 予定'+list.length+'件');
      let html = `<span class="n">${d.getDate()}</span>`;
      list.slice(0,3).forEach(i=>{ html += `<span class="chip ${i.done?'done':''}" style="--cc:${cvar(i.color)}">${i.start?i.start+' ':''}${esc(i.title)}</span>`; });
      if(list.length>3) html += `<span class="more">+${list.length-3}件</span>`;
      html += `<span class="dots">${list.slice(0,6).map(i=>`<i style="--cc:${cvar(i.color)}"></i>`).join('')}</span>`;
      b.innerHTML = html;
      b.onclick = ()=>{ selected = key; if(d.getMonth()!==viewM){ viewY=d.getFullYear(); viewM=d.getMonth(); } render(); };
      days.appendChild(b);
    }
    document.getElementById('legend').innerHTML = COLORS.map((c,i)=>`<span><i style="--cc:${cvar(i)}"></i>${c.name}</span>`).join('');
  }

  // ---- day view
  const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  function itemEl(i, timed){
    const row = document.createElement('div');
    row.className = 'item' + (i.done?' done':'');
    row.style.setProperty('--cc', cvar(i.color));
    row.innerHTML =
      (timed ? `<span class="t">${i.start}${i.end?'<small>〜'+i.end+'</small>':''}</span>` : '') +
      `<button class="check" aria-label="${i.done?'未完了に戻す':'完了にする'}">${CHECK}</button>` +
      `<button class="title" title="タップで編集">${esc(i.title)}</button>` +
      `<span class="tag">${COLORS[i.color]?.name||''}</span>`;
    row.querySelector('.check').onclick = ()=>{ i.done = !i.done; save(); render(); };
    row.querySelector('.title').onclick = ()=> openEdit(i.id);
    return row;
  }
  function renderDay(){
    const d = parse(selected);
    document.getElementById('dayLabel').textContent = (d.getMonth()+1)+'月'+d.getDate()+'日';
    document.getElementById('dayWd').textContent = WD[d.getDay()]+'曜日' + (selected===ymd(today)?'・今日':'');
    const list = byDate(selected);
    const timed = sortTimed(list.filter(i=>i.start));
    const todo = list.filter(i=>!i.start);
    const tl = document.getElementById('timeline'), td = document.getElementById('todo');
    tl.innerHTML=''; td.innerHTML='';
    if(!timed.length) tl.innerHTML = '<div class="empty">時間を入れて追加すると、ここに時系列で並びます</div>';
    timed.forEach(i=>tl.appendChild(itemEl(i,true)));
    if(!todo.length) td.innerHTML = '<div class="empty">時間を空欄にして追加すると、ここに入ります</div>';
    todo.forEach(i=>td.appendChild(itemEl(i,false)));
    const done = list.filter(i=>i.done).length;
    document.getElementById('progText').textContent = list.length ? `${list.length}件中 ${done}件 完了` : 'まだ予定がありません';
    document.getElementById('progBar').style.width = list.length ? (done/list.length*100)+'%' : '0';
  }

  function render(){ renderCalendar(); renderDay(); }

  // ---- add
  buildSwatches(document.getElementById('addSw'), ()=>addColor, i=>addColor=i);
  document.getElementById('addForm').addEventListener('submit', e=>{
    e.preventDefault();
    const t = document.getElementById('addTitle');
    if(!t.value.trim()) return;
    items.push({id:uid(), date:selected, title:t.value.trim(),
      start:document.getElementById('addStart').value, end:document.getElementById('addEnd').value,
      color:addColor, done:false});
    t.value=''; document.getElementById('addStart').value=''; document.getElementById('addEnd').value='';
    save(); render(); t.focus();
  });

  // ---- edit
  const scrim = document.getElementById('editScrim');
  function openEdit(id){
    const i = items.find(x=>x.id===id); if(!i) return;
    editingId = id; editColor = i.color;
    document.getElementById('editTitle').value = i.title;
    document.getElementById('editDate').value = i.date;
    document.getElementById('editStart').value = i.start;
    document.getElementById('editEnd').value = i.end;
    document.getElementById('delBtn').textContent = '削除';
    buildSwatches(document.getElementById('editSw'), ()=>editColor, c=>editColor=c);
    scrim.hidden = false;
    document.getElementById('editTitle').focus();
  }
  function closeEdit(){ scrim.hidden = true; editingId = null; }
  document.getElementById('editForm').addEventListener('submit', e=>{
    e.preventDefault();
    const i = items.find(x=>x.id===editingId); if(!i) return closeEdit();
    i.title = document.getElementById('editTitle').value.trim() || i.title;
    i.date = document.getElementById('editDate').value || i.date;
    i.start = document.getElementById('editStart').value;
    i.end = document.getElementById('editEnd').value;
    i.color = editColor;
    save(); closeEdit(); render();
  });
  document.getElementById('delBtn').onclick = e=>{
    // 2回押しで削除（確認ダイアログの代わり）
    if(e.target.textContent !== '本当に削除'){ e.target.textContent = '本当に削除'; return; }
    items = items.filter(x=>x.id!==editingId); save(); closeEdit(); render();
  };
  document.getElementById('cancelBtn').onclick = closeEdit;
  scrim.addEventListener('click', e=>{ if(e.target===scrim) closeEdit(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !scrim.hidden) closeEdit(); });

  // ---- month nav
  document.getElementById('prev').onclick = ()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} render(); };
  document.getElementById('next').onclick = ()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} render(); };
  document.getElementById('todayBtn').onclick = ()=>{ viewY=today.getFullYear(); viewM=today.getMonth(); selected=ymd(today); render(); };

  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  render();
})();
</script>
</body></html>
