<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お問い合わせ｜寿ウェディング</title>
<meta name="description" content="寿ウェディングへのご相談・お見積もりのお問い合わせ。">
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="寿ウェディング トップへ">
      <img src="images/logo.svg" alt="" width="44" height="44">
      <span class="brand-name"><b>寿ウェディング</b><small>KOTOBUKI WEDDING</small></span>
    </a>
    <nav class="nav" aria-label="メインメニュー">
      <a href="concept.html">Concept</a>
      <a href="plan.html">Plan</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="wrap">
      <img class="rise" src="images/ill-contact.svg" alt="" width="180" height="150">
      <h1 class="rise d1">Contact</h1>
      <p class="ja rise d2">お問い合わせ</p>
    </div>
  </section>

  <section class="section" style="padding-top:24px">
    <div class="wrap">
      <div class="section-head">
        <p>ご相談・お見積もりは無料です。<br>内容を確認のうえ、担当プランナーよりご連絡いたします。</p>
      </div>
      <form class="form" id="contact-form" novalidate>
        <div class="field-row">
          <div class="field">
            <label for="f-name">お名前<span class="req">必須</span></label>
            <input id="f-name" name="name" type="text" autocomplete="name" placeholder="寿 花子" required>
          </div>
          <div class="field">
            <label for="f-role">ご相談者</label>
            <select id="f-role" name="role">
              <option>新郎新婦</option>
              <option>幹事</option>
              <option>その他</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-email">メールアドレス<span class="req">必須</span></label>
            <input id="f-email" name="email" type="email" autocomplete="email" placeholder="example@mail.com" required>
          </div>
          <div class="field">
            <label for="f-tel">電話番号</label>
            <input id="f-tel" name="tel" type="tel" autocomplete="tel" placeholder="090-0000-0000">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-date">二次会のご予定日</label>
            <input id="f-date" name="date" type="date">
          </div>
          <div class="field">
            <label for="f-guests">ご参加予定人数</label>
            <input id="f-guests" name="guests" type="number" min="1" inputmode="numeric" placeholder="50">
          </div>
        </div>
        <fieldset class="field" style="border:0;padding:0;margin:0">
          <legend style="font-weight:700;font-size:15px;color:var(--green-900);padding:0;margin-bottom:6px">気になるサービス（複数選択可）</legend>
          <div class="checks">
            <label><input id="f-s1" type="checkbox" name="service" value="司会"> 司会</label>
            <label><input id="f-s2" type="checkbox" name="service" value="会場手配"> 会場手配</label>
            <label><input id="f-s3" type="checkbox" name="service" value="ゲーム・景品"> ゲーム・景品</label>
            <label><input id="f-s4" type="checkbox" name="service" value="受付・精算"> 受付・精算</label>
            <label><input id="f-s5" type="checkbox" name="service" value="撮影・ムービー"> 撮影・ムービー</label>
            <label><input id="f-s6" type="checkbox" name="service" value="まだ決めていない"> まだ決めていない</label>
          </div>
        </fieldset>
        <div class="field">
          <label for="f-msg">ご相談内容<span class="req">必須</span></label>
          <textarea id="f-msg" name="message" placeholder="会場の希望エリア、ご予算、やりたい演出など、お気軽にご記入ください。" required></textarea>
        </div>
        <p class="form-note" id="form-error" role="alert" hidden style="color:#A3402F">必須項目をご入力ください。</p>
        <button class="btn" type="submit">送信する</button>
        <p class="form-note">※ テスト版のため、現在このフォームから実際の送信は行われません。</p>
      </form>
      <div class="thanks" id="thanks" hidden>
        <img src="images/ill-contact.svg" alt="" width="140" height="120">
        <h2>お問い合わせありがとうございます</h2>
        <p>内容を確認のうえ、担当プランナーよりご連絡いたします。</p>
        <a class="btn ghost" href="index.html">トップへ戻る</a>
      </div>
    </div>
  </section>
  <script src="js/contact.js"></script>
</main>

<footer class="site-footer">
  <div class="wrap">
    <img src="images/logo.svg" alt="" width="56" height="56">
    <span class="brand-name"><b>寿ウェディング</b></span>
    <nav aria-label="フッターメニュー">
      <a href="index.html">Top</a><a href="concept.html">Concept</a><a href="plan.html">Plan</a><a href="contact.html">Contact</a>
    </nav>
    <small>&copy; 寿ウェディング</small>
  </div>
</footer>

</body>
</html>
